<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" width="120" height="132" aria-hidden="true" class="candy candy--redbean" data-working="false" data-still="false" style="--candy-color:#ed353c"><style>.candy { display: block; flex: none; overflow: visible; }
.candy__body { transform-box: view-box; transform-origin: 50px 87px; animation: candy-breathe 6s ease-in-out infinite; }
.candy__eyes { transform-box: fill-box; transform-origin: center; animation: candy-blink 6.4s infinite; }
.candy__gaze { animation: candy-glance 9s ease-in-out infinite; }
.candy--bean .candy__eyes { animation-delay: -1.8s; }
.candy--cushion .candy__eyes { animation-delay: -3.7s; }
.candy--gumdrop .candy__gaze { animation-delay: -2.2s; }
.candy--cushion .candy__gaze { animation-delay: -4.8s; }
.candy--bean[data-working="true"] .candy__body { animation: candy-jelly 1.9s ease-in-out infinite; }
.candy--gumdrop[data-working="true"] .candy__body { animation: candy-squash 1.6s ease-in-out infinite; }
.candy--cushion[data-working="true"] .candy__body { animation: candy-rock 2.2s ease-in-out infinite; }
.candy[data-working="true"] .candy__shadow { transform-origin: 50px 98px; animation: candy-shadow 1.9s ease-in-out infinite; }
@keyframes candy-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.015, .985); } }
@keyframes candy-blink { 0%, 40%, 43%, 72%, 75%, 100% { transform: scaleY(1); } 41.5%, 73.5% { transform: scaleY(.12); } }
@keyframes candy-glance { 0%, 28%, 53%, 100% { transform: translateX(0); } 33%, 46% { transform: translateX(2px); } 73%, 84% { transform: translateX(-1.8px); } }
@keyframes candy-jelly { 0%, 100% { transform: rotate(-3deg) scale(1.01,.99); } 30% { transform: rotate(4deg) scale(.96,1.04); } 60% { transform: rotate(-2deg) scale(1.04,.96); } 80% { transform: rotate(1deg) scale(.99,1.01); } }
@keyframes candy-squash { 0%, 100% { transform: scale(1); } 25% { transform: scale(1.06,.94); } 52% { transform: translateY(-3px) scale(.96,1.04); } 75% { transform: scale(1.025,.975); } }
@keyframes candy-rock { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg) translateY(-1px); } }
@keyframes candy-shadow { 0%, 100% { transform: scaleX(1); opacity: 1; } 50% { transform: scaleX(.91); opacity: .75; } }
.candy[data-still="true"] g, .candy[data-still="true"] ellipse { animation: none !important; }
@media (prefers-reduced-motion: reduce) { .candy g, .candy ellipse { animation: none !important; } }
.candy--sprinkle .candy__eyes { animation-delay: -2.6s; }
.candy--striped .candy__eyes { animation-delay: -4.2s; }
.candy--sprinkle[data-working="true"] .candy__body { animation: candy-roll 2.6s ease-in-out infinite; }
.candy--striped[data-working="true"] .candy__body { animation: candy-ribbon 2s ease-in-out infinite; }
@keyframes candy-roll { 0%,100% { transform: rotate(-6deg) translateX(-1px); } 50% { transform: rotate(6deg) translateX(1px); } }
@keyframes candy-ribbon { 0%,100% { transform: rotate(-3deg) scale(1); } 35% { transform: rotate(3deg) scale(.98,1.02); } 70% { transform: rotate(-1deg) scale(1.02,.98); } }
.candy--cherries .candy__body { transform-origin: 42px 12px; }
.candy--cherries .candy__eyes { animation-delay: -2.9s; }
.candy--round .candy__eyes { animation-delay: -1.1s; }
.candy--redbean .candy__eyes { animation-delay: -4.6s; }
.candy--cherries[data-working="true"] .candy__body { animation: candy-cherry-swing 2.5s ease-in-out infinite; }
.candy--round[data-working="true"] .candy__body { animation: candy-rock 2.8s ease-in-out infinite; }
.candy--redbean[data-working="true"] .candy__body { animation: candy-jelly 2.1s ease-in-out infinite; }
@keyframes candy-cherry-swing { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
.candy--matte .candy__eyes { animation-delay: -3.2s; }
.candy--matte[data-working="true"] .candy__body { animation: candy-rock 3s ease-in-out infinite; }
.candy--floss .candy__body { transform-origin: 50px 100px; animation: candy-drift 7s ease-in-out infinite; }
.candy--floss .candy__eyes { animation-delay: -2.1s; }
.candy--icecream .candy__eyes { animation-delay: -4.1s; }
.candy--floss[data-working="true"] .candy__body { animation: candy-drift 3s ease-in-out infinite; }
.candy--icecream[data-working="true"] .candy__body { animation: candy-cream-bob 2.4s ease-in-out infinite; transform-origin: 50px 102px; }
@keyframes candy-drift { 0%,100% { transform: rotate(-3deg) translateY(0); } 50% { transform: rotate(3deg) translateY(-2px); } }
@keyframes candy-cream-bob { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg) translateY(-2px); } }
.candy--lollipop .candy__body { transform-origin: 50px 100px; }
.candy--lollipop .candy__eyes { animation-delay: -1.9s; }
.candy--cookie .candy__eyes { animation-delay: -3.9s; }
.candy--lollipop[data-working="true"] .candy__body { animation: candy-cherry-swing 2.3s ease-in-out infinite; }
.candy--cookie[data-working="true"] .candy__body { animation: candy-rock 2.7s ease-in-out infinite; }
.candy--softserve .candy__eyes { animation-delay: -2.8s; }
.candy--softserve[data-working="true"] .candy__body { animation: candy-cream-bob 2.6s ease-in-out infinite; transform-origin: 50px 102px; }
